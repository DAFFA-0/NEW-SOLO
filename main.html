<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>𝗦𝗢𝗟𝗢 𝗟𝗘𝗩𝗘𝗟8𝗡𝗚 𝗟𝗘𝗧𝗔𝗦</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"/>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: black;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 2;
    }

    .box {
      width: 320px;
      padding: 20px;
      background-color: rgba(0, 0, 0, 0.8);
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 0 25px #ff0033; /* Changed from #00f2ff to #ff0033 */
      z-index: 2;
      backdrop-filter: blur(5px);
    }

    @keyframes flicker {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; text-shadow: 0 0 5px #ff0033, 0 0 20px #ff0033; } /* Changed from #0ff to #ff0033 */
    }

    h3, h6 {
      color: #ff0033; /* Changed from #00f2ff to #ff0033 */
      animation: flicker 2s infinite alternate;
      margin: 10px 0;
    }

    .input-container {
      display: flex;
      width: 100%;
      margin-top: 15px;
    }

    .input-container input,
    .input-container button {
      height: 3rem;
      font-size: 1rem;
      border: none;
      outline: none;
      box-sizing: border-box;
      transition: none !important;
      transform: none !important;
      resize: none !important;
      appearance: none;
    }

    .input-container input {
      width: 70%;
      border-radius: 0.8rem 0 0 0.8rem;
      background: #ffe0e0; /* Changed from #e0f7ff to #ffe0e0 */
      color: #000;
      padding-left: 1rem;
    }

    .input-container button {
      width: 30%;
      border-radius: 0 0.8rem 0.8rem 0;
      background: #ff3344; /* Changed from #00bfff to #ff3344 */
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }

    .input-container button:hover {
      background: #ff5566; /* Changed from #00ffff to #ff5566 */
      color: #000;
    }

    a.centered-text {
      color: white;
      display: block;
      margin-top: 20px;
      font-weight: bold;
    }

    /* Video background */
    .video-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
      opacity: 0.5;
    }

    /* Sound control button */
    .sound-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 50px;
      height: 50px;
      background: rgba(255, 51, 68, 0.7); /* Changed from rgba(0, 191, 255, 0.7) to rgba(255, 51, 68, 0.7) */
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 10;
      box-shadow: 0 0 10px #ff0033; /* Changed from #00f2ff to #ff0033 */
      transition: all 0.3s;
    }

    .sound-btn:hover {
      background: rgba(255, 85, 102, 0.9); /* Changed from rgba(0, 255, 255, 0.9) to rgba(255, 85, 102, 0.9) */
      transform: scale(1.1);
    }

    .sound-btn i {
      color: white;
      font-size: 20px;
    }

    /* Neon dot overlay */
    .neon-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      z-index: 1;
      pointer-events: none;
    }

    .dot {
      position: absolute;
      width: 4px;
      height: 4px;
      background: #ff0033; /* Changed from #00ffff to #ff0033 */
      border-radius: 50%;
      animation: rise 5s linear infinite;
      opacity: 0.6;
    }

    @keyframes rise {
      0% {
        transform: translateY(100vh) scale(0.5);
        opacity: 0.2;
      }
      100% {
        transform: translateY(-10vh) scale(1);
        opacity: 1;
      }
    }

    /* Help button styles */
    .help-btn {
      position: fixed;
      bottom: 20px;
      left: 20px;
      width: 50px;
      height: 50px;
      background: rgba(255, 140, 0, 0.7);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 10;
      box-shadow: 0 0 10px #ff8c00;
      transition: all 0.3s;
    }

    .help-btn:hover {
      background: rgba(255, 165, 0, 0.9);
      transform: scale(1.1);
    }

    .help-btn i {
      color: white;
      font-size: 20px;
    }

    /* Help panel */
    .help-panel {
      position: fixed;
      bottom: 80px;
      left: 20px;
      width: 250px;
      padding: 15px;
      background-color: rgba(0, 0, 0, 0.9);
      border-radius: 10px;
      box-shadow: 0 0 15px #ff8c00;
      z-index: 10;
      color: white;
      font-size: 14px;
      transform: translateY(20px);
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }

    .help-panel.show {
      transform: translateY(0);
      opacity: 1;
      visibility: visible;
    }

    .help-panel h4 {
      color: #ff8c00;
      margin: 0 0 10px 0;
      text-align: center;
    }

    .help-number {
      display: block;
      text-align: center;
      color: #ff0033; /* Changed from #00f2ff to #ff0033 */
      font-weight: bold;
      font-size: 16px;
      margin: 10px 0;
      text-decoration: none;
      transition: color 0.3s;
    }

    .help-number:hover {
      color: #ff5566; /* Changed from #00ffff to #ff5566 */
      text-decoration: underline;
    }

    .help-close {
      position: absolute;
      top: 5px;
      right: 10px;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <!-- Video Background -->
  <video class="video-background" id="bgVideo" autoplay muted loop>
    <source src="https://files.catbox.moe/52py80.mp4" type="video/mp4"> <!-- Changed to a red-themed video -->
    Your browser does not support HTML5 video.
  </video>
  
  <!-- Neon dot overlay -->
  <div class="neon-overlay" id="dots"></div>

  <!-- Sound control button -->
  <div class="sound-btn" id="soundBtn">
    <i class="fas fa-volume-mute" id="soundIcon"></i>
  </div>

  <!-- Help button -->
  <div class="help-btn" id="helpBtn">
    <i class="fas fa-question"></i>
  </div>

  <!-- Help panel -->
  <div class="help-panel" id="helpPanel">
    <span class="help-close" id="helpClose">&times;</span>
    <h4>Need Help?</h4>
    <p>Contact our support team for assistance:</p>
    <a href="tel:+94774589636" class="help-number">+94 77 45 89 636</a>
    <p>Available 24/7 to help you with any issues.</p>
  </div>

  <div class="container">
    <div class="box" id="box">
      <div id="text">
        <i class="fa fa-user" style="color:#ff0033;"></i> <!-- Changed from #00ffff to #ff0033 -->
        <h3>🥂 𝗦𝗢𝗟𝗢 𝗟𝗘𝗩𝗘𝗟𝗜𝗡𝗚 𝗠𝗜𝗡𝗜 𝗩5 𝗟𝗘𝗧𝗔𝗦 🌟</h3>
        <h6>🏮 𝐌𝐞𝐝𝐚 𝐁𝐲 𝐋𝐞𝐠𝐢𝐨𝐧 𝐎𝐟 𝐃𝐨𝐨𝐦.... </h6>
        <h6>🔢 𝙀𝙉𝙏𝙀𝙍 𝙔𝙊𝙔𝙍 𝙉𝙐𝙈𝘽𝙀𝙍 𝙒𝙄𝙏𝙃 𝘾𝙊𝙐𝙉𝙏𝙍𝙔 𝘾𝙊𝘿𝙀...</h6>

        <div class="input-container">
          <input placeholder="9476xxxxxxx" type="number" id="number">
          <button id="submit">Submit 🔎</button>
        </div>

        <a id="waiting-message" class="centered-text" style="display: none;">Please wait a while...⏳</a>
        <main id="pair"></main>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.0.0-alpha.1/axios.min.js"></script>
  <script>
    let a = document.getElementById("pair");
    let b = document.getElementById("submit");
    let c = document.getElementById("number");
    const video = document.getElementById("bgVideo");
    const soundBtn = document.getElementById("soundBtn");
    const soundIcon = document.getElementById("soundIcon");
    const helpBtn = document.getElementById("helpBtn");
    const helpPanel = document.getElementById("helpPanel");
    const helpClose = document.getElementById("helpClose");

    // Sound control functionality
    soundBtn.addEventListener("click", () => {
      if (video.muted) {
        video.muted = false;
        soundIcon.classList.remove("fa-volume-mute");
        soundIcon.classList.add("fa-volume-up");
      } else {
        video.muted = true;
        soundIcon.classList.remove("fa-volume-up");
        soundIcon.classList.add("fa-volume-mute");
      }
    });

    // Help panel functionality
    helpBtn.addEventListener("click", () => {
      helpPanel.classList.toggle("show");
    });

    helpClose.addEventListener("click", () => {
      helpPanel.classList.remove("show");
    });

    // Close help panel when clicking outside
    document.addEventListener("click", (e) => {
      if (!helpPanel.contains(e.target) && e.target !== helpBtn) {
        helpPanel.classList.remove("show");
      }
    });

    async function Copy() {
      let text = document.getElementById("copy").innerText;
      let obj = document.getElementById("copy");
      await navigator.clipboard.writeText(obj.innerText.replace('CODE: ', ''));
      obj.innerText = "COPIED";
      obj.style = "color:red;font-weight:bold"; /* Changed from blue to red */
      obj.size = "5";
      setTimeout(() => {
        obj.innerText = text;
        obj.style = "color:white;font-weight-bold";
        obj.size = "5";
      }, 500);
    }

    b.addEventListener("click", async (e) => {
      e.preventDefault();
      if (!c.value) {
        a.innerHTML = '<a style="color:white;font-weight:bold">Enter your WhatsApp number with Country Code</a><br><br>';
      } else if (c.value.replace(/[^0-9]/g, "").length < 11) {
        a.innerHTML = '<a style="color:red;font-weight:bold">Invalid Number</a><br><br>';
      } else {
        const number = c.value.replace(/[^0-9]/g, "");
        c.type = "text";
        c.value = "+" + number;
        c.style = "color:black;font-size:20px";
        a.innerHTML = '<a style="color:white;font-weight:bold">Please Wait...</a><br><br>';
        let { data } = await axios(`/code?number=${number}`);
        let code = data.code || "Service Unavailable";
        a.innerHTML = `<font id="copy" onclick="Copy()" style="color:red;font-weight:bold" size="5">CODE: <span style="color:white;">${code}</span></font><br><br><br>`;
      }
    });

    // Dot animation
    const bg = document.getElementById("dots");
    for (let i = 0; i < 80; i++) {
      const dot = document.createElement("div");
      dot.classList.add("dot");
      dot.style.left = Math.random() * 100 + "vw";
      dot.style.animationDuration = 3 + Math.random() * 5 + "s";
      dot.style.animationDelay = Math.random() * 5 + "s";
      bg.appendChild(dot);
    }
  </script>
</body>
</html>
